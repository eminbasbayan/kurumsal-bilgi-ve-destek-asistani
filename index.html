    function renderChatMessage(m){if(m.role==='user')return `<div class="chat-msg user"><span class="avatar">${profile.initials}</span><div class="bubble"><p class="prose">${esc(m.text)}</p><div class="message-foot mono">${date(m.at)}</div></div></div>`;return `<div class="chat-msg"><span class="avatar">KA</span><div class="bubble"><p class="prose">${esc(m.text)}</p>${m.sources?.length?`<div class="sources">${m.sources.map((key,i)=>`<button type="button" class="source-btn" data-action="open-source" data-key="${key}" aria-label="Kaynak ${i+1}: ${esc(docs[key].title)} bölümünü aç">${icon('file')} [${i+1}] ${esc(docs[key].title)} · ${esc(docs[key].section)}</button>`).join('')}</div>`:''}<div class="chat-tools"><button type="button" class="btn btn-quiet btn-sm" data-action="copy-answer" data-id="${m.id}">${icon('copy')} Kopyala</button><button type="button" class="btn btn-quiet btn-sm ${m.feedback==='yes'?'selected':''}" data-action="feedback" data-id="${m.id}" data-value="yes" aria-pressed="${m.feedback==='yes'}">${icon('thumb')} Faydalı</button><button type="button" class="btn btn-quiet btn-sm ${m.feedback==='no'?'selected':''}" data-action="feedback" data-id="${m.id}" data-value="no" aria-pressed="${m.feedback==='no'}">Faydalı değil</button><button type="button" class="btn btn-quiet btn-sm" data-action="support-from-chat" data-id="${m.id}">Sorunum çözülmedi, destek talebi oluştur ${icon('arrow')}</button></div><div class="message-foot mono">${date(m.at)} · Demo yanıtı</div></div></div>`}
    function beginQuestion(q){const text=q.trim();if(!text||ui.typing)return;let chat=activeChat();if(!chat){chat={id:uid(),title:text.length>36?text.slice(0,36)+'…':text,createdAt:now(),messages:[]};state.chats.unshift(chat);state.activeChatId=chat.id}chat.messages.push({id:uid(),role:'user',text,at:now()});save();ui.typing=true;navigate('/assistant');render();setTimeout(()=>{const target=state.chats.find(c=>c.id===chat.id);if(!target)return;target.messages.push({id:uid(),role:'assistant',...answerFor(text),at:now(),question:text,feedback:null});ui.typing=false;save();render();},650)}
    function sourceModal(key,trigger){const d=docs[key];if(!d)return;ui.modal={key};ui.modalTrigger=trigger;$('#modal-root').innerHTML=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">Demo belge kaynağı</div><h2 id="modal-title">${esc(d.title)}</h2></div><button type="button" class="icon-btn" data-action="close-modal" aria-label="Kaynağı kapat">${icon('x')}</button></div><div class="modal-body"><div class="subtle-box" style="margin-bottom:20px"><div class="small">BÖLÜM</div><h3 style="margin:5px 0 12px">${esc(d.section)}</h3><div class="small">Son güncelleme: ${shortDate(d.updated)}</div></div><p class="prose">${esc(d.text)}</p><p class="small" style="margin-top:24px">Bu belge, prototip için hazırlanmış kurgusal örnek içeriktir.</p></div></section></div>`;document.body.style.overflow='hidden';$('#modal-root .icon-btn').focus()}

    function contextHTML(ctx){if(!ctx)return'';return `<div class="context-box"><div class="small" style="font-weight:600;margin-bottom:8px">ASİSTANDAN AKTARILAN BAĞLAM</div><p><strong>Soru:</strong> ${esc(ctx.question)}</p><p><strong>Yanıt:</strong> ${esc(ctx.answer)}</p>${ctx.sources?.length?`<div class="sources">${ctx.sources.map((key,i)=>`<button type="button" class="source-btn" data-action="open-source" data-key="${key}">${icon('file')} [${i+1}] ${esc(docs[key]?.title||'Kaynak')} · ${esc(docs[key]?.section||'')}</button>`).join('')}</div>`:''}</div>`}
    function newRequest(){const draft=state.requestDraft||{};return `${pageHead('Destek','Yeni Destek Talebi','Sorununuzu anlatın; demo talebiniz bu tarayıcıda kaydedilsin.')}<form id="request-form" class="card card-pad" novalidate><div class="form-grid"><div class="field"><label for="category">Kategori <span aria-hidden="true">*</span></label><select id="category" name="category" aria-invalid="${!!ui.formErrors.category}"><option value="">Kategori seçin</option>${Object.keys(categories).map(c=>`<option value="${esc(c)}" ${draft.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="error" id="category-error">${esc(ui.formErrors.category||'')}</span></div><div class="field"><label for="subcategory">Alt kategori <span aria-hidden="true">*</span></label><select id="subcategory" name="subcategory" aria-invalid="${!!ui.formErrors.subcategory}"><option value="">Alt kategori seçin</option>${(categories[draft.category]||[]).map(c=>`<option value="${esc(c)}" ${draft.subcategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="error" id="subcategory-error">${esc(ui.formErrors.subcategory||'')}</span></div><div class="field span-2"><label for="subject">Konu <span aria-hidden="true">*</span></label><input id="subject" name="subject" maxlength="120" value="${esc(draft.subject||'')}" placeholder="Sorununuzu kısaca özetleyin" aria-invalid="${!!ui.formErrors.subject}"><span class="error" id="subject-error">${esc(ui.formErrors.subject||'')}</span></div><div class="field span-2"><label for="description">Açıklama <span aria-hidden="true">*</span></label><textarea id="description" name="description" maxlength="5000" placeholder="Sorunu ve denediğiniz adımları açıklayın" aria-invalid="${!!ui.formErrors.description}">${esc(draft.description||'')}</textarea><span class="error" id="description-error">${esc(ui.formErrors.description||'')}</span></div><div class="field"><label for="priority">Öncelik <span aria-hidden="true">*</span></label><select id="priority" name="priority"><option value="Düşük" ${draft.priority==='Düşük'?'selected':''}>Düşük</option><option value="Normal" ${!draft.priority||draft.priority==='Normal'?'selected':''}>Normal</option><option value="Yüksek" ${draft.priority==='Yüksek'?'selected':''}>Yüksek</option></select><span class="error" id="priority-error"></span></div><div class="field"><label for="attachments">Dosya ekleri</label><input id="attachments" name="attachments" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg"><span class="hint">PDF, PNG veya JPG · Dosya başına en fazla 5 MB</span><span class="error" id="files-error">${esc(ui.formErrors.files||'')}</span></div><div class="span-2" id="file-list">${fileList()}</div>${draft.context?`<div class="span-2"><div class="section-row"><h3>Aktarılacak konuşma bağlamı</h3><button type="button" class="btn btn-quiet btn-sm" data-action="remove-context">${icon('x')} Bağlamı çıkar</button></div>${contextHTML(draft.context)}<p class="small" style="margin:9px 0 0">Bu içerik talebe eklenmeden önce incelenebilir ve çıkarılabilir.</p></div>`:''}<div class="span-2 notice">${icon('info')}<span>Dosyalar sunucuya yüklenmez. Yalnızca ad ve boyut bilgileri kaydedilir; sayfa yenilendiğinde dosya içeriği erişilebilir değildir.</span></div></div><div class="form-footer"><a href="#/requests" class="btn btn-secondary">Vazgeç</a><button class="btn btn-primary" type="submit" id="submit-request">${icon('send')} Talebi oluştur</button></div></form>`}
    function fileList(){return ui.files.length?`<div class="file-list">${ui.files.map((f,i)=>`<div class="file-row"><span>${icon('paperclip')} ${esc(f.name)} <span class="small">(${(f.size/1024/1024).toFixed(2)} MB)</span></span><button type="button" class="icon-btn" data-action="remove-file" data-index="${i}" aria-label="${esc(f.name)} dosyasını kaldır">${icon('x')}</button></div>`).join('')}</div>`:''}
    function requestsPage(){const f=ui.filters;let list=[...state.requests];const q=f.q.toLocaleLowerCase('tr-TR').trim();if(q)list=list.filter(r=>(r.subject+' '+r.id).toLocaleLowerCase('tr-TR').includes(q));if(f.status)list=list.filter(r=>r.status===f.status);if(f.category)list=list.filter(r=>r.category===f.category);list.sort((a,b)=>(new Date(b.updatedAt)-new Date(a.updatedAt))*(f.sort==='old'?-1:1));return `${pageHead('Takip','Taleplerim','Destek taleplerinizi arayın, filtreleyin ve ayrıntılarını inceleyin.',`<a href="#/requests/new" class="btn btn-primary">${icon('plus')} Yeni Destek Talebi</a>`)}<div class="card card-pad" style="margin-bottom:18px"><div class="filter-bar"><div class="field"><label for="filter-q">Konu veya talep no</label><input id="filter-q" value="${esc(f.q)}" placeholder="Ara..." autocomplete="off"></div><div class="field"><label for="filter-status">Durum</label><select id="filter-status"><option value="">Tüm durumlar</option>${statuses.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="filter-category">Kategori</label><select id="filter-category"><option value="">Tüm kategoriler</option>${Object.keys(categories).map(c=>`<option ${f.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label for="filter-sort">Son güncelleme</label><select id="filter-sort"><option value="new" ${f.sort==='new'?'selected':''}>En yeni</option><option value="old" ${f.sort==='old'?'selected':''}>En eski</option></select></div><button type="button" class="btn btn-secondary" data-action="clear-filters">Temizle</button></div></div><div id="request-results">${list.length?requestTable(list):`<div class="card empty">${icon('search')}<h3>Sonuç bulunamadı</h3><p>Arama veya filtrelerinizi değiştirerek yeniden deneyin.</p><button class="btn btn-secondary" type="button" data-action="clear-filters">Filtreleri temizle</button></div>`}</div><p class="small mono" style="margin-top:12px">${list.length} talep gösteriliyor</p>`}
    function requestDetail(id){const r=state.requests.find(x=>x.id===id);if(!r)return `${pageHead('Talep','Talep bulunamadı','Bu numaraya ait bir demo talebi yok.')}<div class="card empty">${icon('info')}<h3>Talep bulunamadı</h3><p>Bağlantıyı kontrol edin veya talepler listesine dönün.</p><a class="btn btn-primary" href="#/requests">Taleplerime dön</a></div>`;return `${pageHead('Talep Detayı',esc(r.id),esc(r.subject),`<a href="#/requests" class="btn btn-secondary">${icon('list')} Taleplerime dön</a>`)}<div class="detail-layout"><div class="grid"><section class="card card-pad"><div class="section-row"><h2>Talep bilgileri</h2>${badge(r.status)}</div><dl class="detail-meta"><div class="meta-item"><dt>Kategori / Alt kategori</dt><dd>${esc(r.category)} / ${esc(r.subcategory)}</dd></div><div class="meta-item"><dt>Öncelik</dt><dd class="priority-${r.priority==='Yüksek'?'high':r.priority==='Düşük'?'low':'normal'}">${esc(r.priority)}</dd></div><div class="meta-item"><dt>Oluşturulma</dt><dd class="mono">${date(r.createdAt)}</dd></div><div class="meta-item"><dt>Son güncelleme</dt><dd class="mono">${date(r.updatedAt)}</dd></div><div class="meta-item"><dt>Atanan destek ekibi</dt><dd>${esc(r.team)}</dd></div></dl><h3 style="margin-top:26px">Açıklama</h3><p class="prose">${esc(r.description)}</p>${r.files.length?`<h3 style="margin-top:24px">Dosya bilgileri</h3><div class="file-list">${r.files.map(f=>`<div class="file-row"><span>${icon('paperclip')} ${esc(f.name)} <span class="small">(${(f.size/1024/1024).toFixed(2)} MB)</span></span></div>`).join('')}</div><p class="small" style="margin-top:8px">Dosya içerikleri demo ortamında saklanmaz.</p>`:''}${r.context?`<h3 style="margin-top:24px">Asistan konuşma bağlamı</h3>${contextHTML(r.context)}`:''}</section><section class="card card-pad"><h2>Yazışmalar</h2><p class="small">Destek ekibine ait örnek mesajlar demo verisidir; canlı yanıt üretilmez.</p><div class="message-list">${r.messages.length?r.messages.map(m=>`<article class="thread-message ${m.by==='employee'?'employee':''}"><div class="message-top"><strong>${esc(m.author)}</strong><time class="mono">${date(m.at)}</time></div><p>${esc(m.text)}</p></article>`).join(''):'<div class="subtle-box muted">Henüz mesaj yok. İlk mesajı siz gönderin.</div>'}</div><form id="detail-message-form" data-id="${esc(r.id)}" style="margin-top:22px"><div class="field"><label for="detail-message">Yeni mesaj</label><textarea id="detail-message" name="message" maxlength="5000" placeholder="Destek ekibine mesajınızı yazın..."></textarea><span class="error" id="detail-message-error"></span></div><button class="btn btn-primary" type="submit" style="margin-top:12px">${icon('send')} Mesajı gönder</button></form></section></div><aside class="grid" style="align-content:start"><section class="card card-pad"><h2>Durum geçmişi</h2><ol class="timeline">${r.history.map(h=>`<li><strong>${esc(h.status)}</strong><p>${esc(h.note)}</p><p>${esc(h.by)}</p><time class="mono">${date(h.at)}</time></li>`).join('')}</ol></section><div class="notice">${icon('info')}<span>Bu talep ve yazışmalar kurgusal demo verileridir.</span></div></aside></div>`}
    function notificationsPage(){const rows=[...state.notifications].sort((a,b)=>new Date(b.at)-new Date(a.at));return `${pageHead('Güncellemeler','Bildirimler','Talep güncellemelerinizi burada görüntüleyin.',`<button class="btn btn-secondary" type="button" data-action="mark-all" ${unread()?'':'disabled'}>${icon('check')} Tümünü okundu işaretle</button>`)}<div class="card">${rows.length?rows.map(n=>`<article class="notification ${n.read?'':'unread'}"><span class="notification-icon">${icon('bell')}</span><div class="notification-body"><strong>${esc(n.title)}</strong><p>${esc(n.text)}</p><span class="small mono">${date(n.at)} · ${n.read?'Okundu':'Okunmadı'}</span><div class="notification-actions"><button class="btn btn-quiet btn-sm" type="button" data-action="open-notification" data-id="${n.id}">Talebi görüntüle ${icon('arrow')}</button>${n.read?'':`<button class="btn btn-quiet btn-sm" type="button" data-action="mark-read" data-id="${n.id}">Okundu işaretle</button>`}</div></div></article>`).join(''):`<div class="empty">${icon('bell')}<h3>Bildirim yok</h3><p>Talep güncellemeleri burada görünecek.</p></div>`}</div>`}
    function profilePage(){return `${pageHead('Hesabım','Profil','Demo çalışan bilgileriniz salt okunur olarak gösterilir.')}<div class="profile-grid"><div class="card card-pad profile-side"><span class="avatar large">${profile.initials}</span><h2 style="margin-bottom:4px">${profile.name}</h2><p class="muted">${profile.title}</p><span class="badge status-new">Demo profil</span></div><div class="card card-pad"><div class="section-row"><h2>Çalışan bilgileri</h2></div><div class="profile-fields"><div class="subtle-box"><span>Ad soyad</span><strong>${profile.name}</strong></div><div class="subtle-box"><span>Kurumsal e-posta</span><strong>${profile.email}</strong></div><div class="subtle-box"><span>Departman</span><strong>${profile.department}</strong></div><div class="subtle-box"><span>Unvan</span><strong>${profile.title}</strong></div></div><p class="small" style="margin:20px 0">Bu bilgiler kurumsal dizin görünümü için hazırlanmış kurgusal demo verisidir.</p><button type="button" class="btn btn-secondary" data-action="logout">${icon('logout')} Çıkış yap</button></div></div>`}
    function render(){let p=route();if(!state.loggedIn&&p!=='/login'){navigate('/login');return}if(state.loggedIn&&p==='/login'){navigate('/dashboard');return}let content;if(p==='/dashboard')content=dashboard();else if(p==='/assistant')content=assistant();else if(p==='/requests/new')content=newRequest();else if(p==='/requests')content=requestsPage();else if(p.startsWith('/requests/'))content=requestDetail(p.slice('/requests/'.length));else if(p==='/notifications')content=notificationsPage();else if(p==='/profile')content=profilePage();else content=`${pageHead('Hata','Sayfa bulunamadı','Aradığınız sayfa mevcut değil.')}<a class="btn btn-primary" href="#/dashboard">Ana Sayfaya dön</a>`;app.innerHTML=p==='/login'?login():shell(p,content);const chip=$('.user-chip');if(chip){const logout=document.createElement('button');logout.type='button';logout.className='icon-btn';logout.dataset.action='logout';logout.setAttribute('aria-label','Çıkış yap');logout.title='Çıkış yap';logout.innerHTML=icon('logout');chip.append(logout)}document.title=titleFor(p)+' | Kurumsal Bilgi ve Destek';if(p==='/assistant'){const sc=$('#chat-scroll');if(sc)sc.scrollTop=sc.scrollHeight}}
    function setDraftFromChat(id){const chat=activeChat();const m=chat?.messages.find(x=>x.id===id&&x.role==='assistant');if(!m)return;const q=m.question||'';state.requestDraft={category:m.category||'',subcategory:m.sub||'',subject:q.slice(0,120),description:q,priority:'Normal',context:{question:q,answer:m.text,sources:m.sources||[]}};ui.files=[];ui.formErrors={};save();navigate('/requests/new')}
    function updateRequestResults(){if(route()!=='/requests')return;const active=document.activeElement;const pos=active?.selectionStart;render();if(active?.id==='filter-q'){const el=$('#filter-q');el?.focus();if(typeof pos==='number')el?.setSelectionRange(pos,pos)}}
    function loginSuccess(){state.loggedIn=true;save();navigate('/dashboard');toast('Demo oturumu açıldı.')}
    function submitRequest(form){const fd=new FormData(form);const value=k=>String(fd.get(k)||'').trim();const category=value('category'),subcategory=value('subcategory'),subject=value('subject'),description=value('description'),priority=value('priority');const errors={};if(!category||!categories[category])errors.category='Kategori seçin.';if(!subcategory||!categories[category]?.includes(subcategory))errors.subcategory='Alt kategori seçin.';if(subject.length<5)errors.subject='Konu en az 5 karakter olmalı.';if(description.length<10)errors.description='Açıklama en az 10 karakter olmalı.';if(!['Düşük','Normal','Yüksek'].includes(priority))errors.priority='Öncelik seçin.';ui.formErrors=errors;for(const k of ['category','subcategory','subject','description','priority']){const el=$('#'+k);if(el)el.setAttribute('aria-invalid',!!errors[k]);const error=$('#'+k+'-error');if(error)error.textContent=errors[k]||''}if(Object.keys(errors).length){$('#'+Object.keys(errors)[0])?.focus();toast('Lütfen formdaki eksik alanları düzeltin.',true);return}const btn=$('#submit-request');btn.disabled=true;btn.textContent='Kaydediliyor...';let id;do{id='TLP-'+new Date().getFullYear()+'-'+String(state.nextNumber++).padStart(4,'0')}while(state.requests.some(r=>r.id===id));const created=now();const r={id,subject,category,subcategory,priority,status:'Yeni',description,createdAt:created,updatedAt:created,team:category+' Ekibi',files:ui.files.map(f=>({name:f.name,size:f.size,type:f.type})),context:state.requestDraft?.context||null,messages:[],history:[{status:'Yeni',note:'Talep oluşturuldu.',by:profile.name,at:created}]};state.requests.unshift(r);state.notifications.unshift({id:uid(),requestId:id,title:'Talebiniz oluşturuldu',text:subject,at:created,read:false});state.requestDraft=null;ui.files=[];ui.formErrors={};save();navigate('/requests/'+encodeURIComponent(id));toast(id+' numaralı talebiniz oluşturuldu.')}
    document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='toggle-menu'){ui.menu=!ui.menu;render();return}if(action==='close-menu'){ui.menu=false;render();return}if(action==='demo-login'){loginSuccess();return}if(action==='toggle-password'){const input=$('#login-password');input.type=input.type==='password'?'text':'password';el.setAttribute('aria-label',input.type==='password'?'Şifreyi göster':'Şifreyi gizle');el.innerHTML=icon(input.type==='password'?'eye':'eyeoff');return}if(action==='ask-question'){beginQuestion(el.dataset.question);return}if(action==='new-chat'){state.activeChatId=null;save();render();$('#chat-input')?.focus();return}if(action==='select-chat'){state.activeChatId=el.dataset.id;save();render();return}if(action==='open-source'){sourceModal(el.dataset.key,el);return}if(action==='close-modal'){if(e.target.closest('.modal')&&e.target!==el&&el.classList.contains('modal-backdrop'))return;closeModal();return}if(action==='feedback'){const m=activeChat()?.messages.find(x=>x.id===el.dataset.id);if(m){m.feedback=m.feedback===el.dataset.value?null:el.dataset.value;save();render();toast(m.feedback?'Geri bildiriminiz kaydedildi.':'Geri bildirim kaldırıldı.')}return}if(action==='copy-answer'){const m=activeChat()?.messages.find(x=>x.id===el.dataset.id);if(!m)return;try{await navigator.clipboard.writeText(m.text);toast('Yanıt kopyalandı.')}catch{toast('Kopyalama bu tarayıcıda kullanılamıyor.',true)}return}if(action==='support-from-chat'){setDraftFromChat(el.dataset.id);return}if(action==='remove-context'){state.requestDraft={...(state.requestDraft||{}),context:null};save();render();toast('Konuşma bağlamı çıkarıldı.');return}if(action==='remove-file'){ui.files.splice(Number(el.dataset.index),1);$('#file-list').innerHTML=fileList();return}if(action==='clear-filters'){ui.filters={q:'',status:'',category:'',sort:'new'};render();return}if(action==='mark-read'){const n=state.notifications.find(x=>x.id===el.dataset.id);if(n){n.read=true;save();render()}return}if(action==='mark-all'){state.notifications.forEach(n=>n.read=true);save();render();toast('Tüm bildirimler okundu olarak işaretlendi.');return}if(action==='open-notification'){const n=state.notifications.find(x=>x.id===el.dataset.id);if(n){n.read=true;save();navigate('/requests/'+encodeURIComponent(n.requestId))}return}if(action==='logout'){state.loggedIn=false;save();navigate('/login');toast('Demo oturumu kapatıldı.');return}});
    document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();const email=$('#login-email'),password=$('#login-password');const ev=email.value.trim(),pv=password.value;const em=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ev)?'':'Geçerli bir e-posta adresi girin.';const pm=pv.length>=4?'':'Şifre en az 4 karakter olmalı.';$('#email-error').textContent=em;$('#password-error').textContent=pm;email.setAttribute('aria-invalid',!!em);password.setAttribute('aria-invalid',!!pm);if(em||pm){(em?email:password).focus();return}loginSuccess();return}if(e.target.id==='chat-form'){e.preventDefault();const input=$('#chat-input');const q=input.value;input.value='';beginQuestion(q);return}if(e.target.id==='request-form'){e.preventDefault();if($('#submit-request')?.disabled)return;submitRequest(e.target);return}if(e.target.id==='detail-message-form'){e.preventDefault();const r=state.requests.find(x=>x.id===e.target.dataset.id);const input=$('#detail-message'),text=input.value.trim();if(!text){$('#detail-message-error').textContent='Mesaj boş olamaz.';input.focus();return}if(!r)return;const at=now();r.messages.push({id:uid(),by:'employee',author:profile.name,text,at});r.updatedAt=at;save();render();toast('Mesajınız talebe eklendi.');return}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){closeModal();return}if(e.key==='Tab'&&ui.modal){const box=$('#modal-root .modal');const focusable=[...box.querySelectorAll('button,[href],input,textarea,select,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);if(focusable.length){if(e.shiftKey&&document.activeElement===focusable[0]){e.preventDefault();focusable.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===focusable.at(-1)){e.preventDefault();focusable[0].focus()}}}if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();e.target.form.requestSubmit()}});
    document.addEventListener('change',e=>{if(e.target.id==='category'){const c=e.target.value;const sub=$('#subcategory');sub.innerHTML='<option value="">Alt kategori seçin</option>'+(categories[c]||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');return}if(e.target.id==='attachments'){const accepted=['application/pdf','image/png','image/jpeg'];let invalid=[];for(const f of e.target.files){const ext=f.name.toLowerCase().split('.').pop();if(!accepted.includes(f.type)||!['pdf','png','jpg','jpeg'].includes(ext)||f.size>5*1024*1024){invalid.push(f.name);continue}ui.files.push({name:f.name,size:f.size,type:f.type})}e.target.value='';$('#file-list').innerHTML=fileList();$('#files-error').textContent=invalid.length?'Uygun olmayan dosya: '+invalid.join(', '):'';if(invalid.length)toast('Bazı dosyalar eklenmedi. Tür ve boyut sınırını kontrol edin.',true);return}if(e.target.id==='filter-status'){ui.filters.status=e.target.value;updateRequestResults()}if(e.target.id==='filter-category'){ui.filters.category=e.target.value;updateRequestResults()}if(e.target.id==='filter-sort'){ui.filters.sort=e.target.value;updateRequestResults()}});
    document.addEventListener('input',e=>{if(e.target.id==='filter-q'){ui.filters.q=e.target.value;updateRequestResults()}if(e.target.id==='detail-message'&&e.target.value.trim()){$('#detail-message-error').textContent=''}});
    function rememberRequestField(target){
      if(route()!=='/requests/new'||!['category','subcategory','subject','description','priority'].includes(target?.id))return;
      state.requestDraft={...(state.requestDraft||{}),[target.id]:target.value};
      if(target.id==='category')state.requestDraft.subcategory='';
      save();
    }
    document.addEventListener('input',e=>rememberRequestField(e.target));
    document.addEventListener('change',e=>rememberRequestField(e.target));
    document.addEventListener('click',async e=>{
      const button=e.target.closest('[data-action="copy-answer"]');
      if(!button)return;
      e.stopPropagation();
      const message=activeChat()?.messages.find(m=>m.id===button.dataset.id);
      if(!message)return;
      try{
        if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(message.text);
        else throw Error('Clipboard API unavailable');
        toast('Yanıt kopyalandı.');
      }catch{
        const field=document.createElement('textarea');
        field.value=message.text;
        field.style.position='fixed';field.style.opacity='0';
        document.body.append(field);field.select();
        const copied=document.execCommand('copy');field.remove();
        toast(copied?'Yanıt kopyalandı.':'Kopyalama bu tarayıcıda kullanılamıyor.',!copied);
      }
    },true);
    window.addEventListener('hashchange',()=>{ui.menu=false;closeModal();render();window.scrollTo(0,0)});
    if(!location.hash)location.hash='/login';render();if(!persistent)setTimeout(()=>toast('Depolama kullanılamıyor; değişiklikler yalnızca bu oturumda kalacak.',true),300);
  })();
  </script>
</body>
</html>
